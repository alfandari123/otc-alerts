name: Diagnose sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "empty = all sources, prn = PR Newswire variants, ai = Gemini models"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Check which data sources answer from GitHub's servers
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bot.diag ${{ inputs.mode }}
