name: OTC alerts

# Each run starts the next one as its FIRST step (so a GitHub server dying mid-run cannot break the loop);
# the "pace" environment makes the next run wait ~4 minutes (no server is used while waiting).
# watchdog.yml restarts this loop if it ever stops; the schedule below is one more safety net.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write              # save the encrypted state to the `state` branch
  actions: write               # start the next run, revive the watchdog, keep schedules enabled

concurrency:
  group: otc-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pace               # wait timer: 4 minutes
      deployment: false
    steps:
      - name: Start the next run, revive the watchdog if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do gh workflow run run.yml --repo "$REPO" && break; sleep 10; done
          active=$(gh run list --repo "$REPO" --workflow watchdog.yml --limit 5 --json status \
                   --jq '[.[] | select(.status != "completed")] | length' || echo 1)
          if [ "$active" -eq 0 ]; then gh workflow run watchdog.yml --repo "$REPO" || true; fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Load state
        id: load
        run: |
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            git fetch -q --depth=1 origin state
            git show FETCH_HEAD:state.bin > state.bin
          else
            echo "No saved state yet (first run)."
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python -m bot.main

      - name: Save state
        if: always() && steps.load.outcome == 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f state.bin ] || exit 0
          mkdir -p /tmp/st && cp state.bin /tmp/st/ && cd /tmp/st
          git init -q -b state
          git add state.bin
          git -c user.name="otc-alerts-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "state"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" state

      - name: Keep schedules alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub disables schedules after 60 days without activity; re-enable once a day.
          if [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 15 ]; then
            for wf in run.yml watchdog.yml; do
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
            done
          fi
