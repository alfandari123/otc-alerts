<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מסך מסחר OTC</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131722">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e14;--panel:#131722;--line:#232a38;--text:#d7dce5;--mute:#8a93a6;--up:#26a69a;--down:#ef5350;--acc:#4c8dff;--warn:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#2b3245;color:var(--mute)}
.badge.live{background:#123d34;color:#5ee0c4}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:20px;font-weight:600;direction:ltr;text-align:right}
.kpi .s{font-size:12px;direction:ltr;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
section h2{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
section h2 .c{color:var(--mute);font-weight:400}
.chart{height:220px}
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:#1c2230;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;font:inherit}
.tab.on{border-color:var(--acc);color:#fff}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px;background:#161b26}
td.n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.why{white-space:normal;min-width:200px;color:var(--mute);font-size:12px}
.posinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.posinfo div{font-size:12px;color:var(--mute)}.posinfo b{display:block;color:var(--text);font-size:14px;direction:ltr;text-align:right}
.empty{padding:16px 12px;color:var(--mute)}
.err{margin:40px auto;max-width:420px;text-align:center;color:var(--mute)}
.pill{font-size:11px;padding:1px 6px;border-radius:8px;background:#2b3245}
.pill.g{background:#123d34;color:#5ee0c4}.pill.r{background:#3d1717;color:#ff8a80}.pill.y{background:#3d3212;color:var(--warn)}
a{color:var(--acc)}
footer{color:var(--mute);font-size:12px;text-align:center;padding:8px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:0}
.l1{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.l1 div{font-size:11px;color:var(--mute)}.l1 b{display:block;font-size:15px;color:var(--text);direction:ltr;text-align:right}
.book td,.book th{padding:4px 8px;font-size:12px}.book .b{color:var(--up)}.book .a{color:var(--down)}
.tape{max-height:260px;overflow-y:auto}.tape td{padding:3px 8px;font-size:12px}
.buy{color:var(--up)}.sell{color:var(--down)}
.insight{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.livebar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.livebar input{background:#1c2230;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px;width:90px;font:inherit;direction:ltr}
@media (max-width:520px){.lv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📈 מסך מסחר OTC <span id="mode" class="mute" style="font-weight:400;font-size:12px">· כסף וירטואלי</span></h1>
<button id="inst" class="tab" style="display:none">📲 התקן אפליקציה</button>
<span id="upd" class="badge">טוען…</span></header>
<main id="app"></main>
<main id="livebox" style="padding-top:0"><section id="live"><h2>⚡ שוק חי <span class="c">Level 1 · Level 2 · עסקאות בזמן אמת</span></h2><div id="liveBody" class="empty">טוען…</div></section></main>
<footer>הסוכן קונה ומוכר לפי מחירי Yahoo של כל דקה · קנייה צעד מחיר מעל המחיר האחרון, מכירה צעד מתחת · עמלה <span id="fee"></span> לכל פעולה</footer>
<script>
const RAW = "https://raw.githubusercontent.com/alfandari123/otc-alerts/state/dash.bin";
const API = "https://api.github.com/repos/alfandari123/otc-alerts/contents/dash.bin?ref=state";
const $ = s => document.querySelector(s);
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
// The personal key arrives once in the link (#k=...&s=...) and is kept on this device, so the installed app
// (which opens without the link) still has it. It never goes to any server.
const HP = new URLSearchParams(location.hash.slice(1));
function keep(name, v){ try { if (v) localStorage.setItem(name, v); return v || localStorage.getItem(name); } catch(e){ return v; } }
const key = keep("otc_k", HP.get("k"));
if (HP.get("k")) history.replaceState(null, "", location.pathname);   // the key does not stay in the address bar
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEv = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEv = e; $("#inst").style.display = ""; });
document.addEventListener("click", e => { if (e.target.id === "inst" && installEv) { installEv.prompt(); installEv = null; e.target.style.display = "none"; } });
let data = null, sel = null, charts = [];

function b64(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function load(){
  let txt;
  try { const r = await fetch(RAW + "?t=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw 0; txt = await r.text(); }
  catch(e){ const r = await fetch(API, {headers:{Accept:"application/vnd.github.raw"}}); txt = await r.text(); }
  const all = b64(txt.trim()), k = await crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:all.slice(0,12)}, k, all.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
const px = p => p == null ? "?" : (p < 1 ? (+p).toFixed(6).replace(/0+$/,"").replace(/\.$/,"") : (+p).toFixed(2));
const usd = (x, sign) => (sign && x > 0 ? "+" : x < 0 ? "−" : "") + "$" + Math.abs(x).toLocaleString("en-US",{maximumFractionDigits: Math.abs(x) < 100 ? 2 : 0});
const pct = x => (x > 0 ? "+" : "") + x.toFixed(1) + "%";
const cls = x => x > 0.005 ? "up" : x < -0.005 ? "down" : "";
const d8 = ts => new Date(ts*1000).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const days = ts => ((Date.now()/1000 - ts)/86400);
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tz = -new Date().getTimezoneOffset()*60; // charts show the phone's local time

function insTable(rows){
  if (!rows || !rows.length) return `<div class="insight mute">אינסיידרים: אין דיווחים ב-90 הימים האחרונים (או שהחברה לא מדווחת ל-SEC).</div>`;
  const cl = c => c === "P" ? "buy" : (c === "S" || c === "C" || c === "144") ? "sell" : "";
  return `<h2 style="border-top:1px solid var(--line)">אינסיידרים <span class="c">מנהלים ובעלי מניות גדולים · 90 יום</span></h2><div class="wrap"><table>
    <tr><th>תאריך</th><th>מי</th><th>פעולה</th><th>מניות</th><th>מחיר</th></tr>` + rows.map(r => `<tr><td>${r.date.slice(8,10)}/${r.date.slice(5,7)}</td>
    <td class="why">${esc(r.owner)}${r.role ? ` <span class="mute">(${esc(r.role)})</span>` : ""}</td><td class="${cl(r.code)}">${esc(r.what)}</td>
    <td class="n">${r.shares ? Math.round(r.shares).toLocaleString() : ""}</td><td class="n">${r.price ? "$" + px(r.price) : ""}</td></tr>`).join("") + `</table></div>`;
}

function chart(el, h){
  const c = LightweightCharts.createChart(el, {height:h, layout:{background:{color:"#131722"}, textColor:"#8a93a6"},
    grid:{vertLines:{color:"#1c2230"}, horzLines:{color:"#1c2230"}}, rightPriceScale:{borderColor:"#232a38"},
    timeScale:{borderColor:"#232a38", timeVisible:true, secondsVisible:false}, crosshair:{mode:0}, autoSize:true});
  charts.push(c); return c;
}

function render(){
  charts.forEach(c => c.remove()); charts = [];
  const d = data, open = d.pos.reduce((a,p) => a + p.shares*((p.last||p.entry) - p.entry), 0);
  const closed = d.closed, wins = closed.filter(x => x.pnl > 0.005), real = closed.reduce((a,x) => a + x.pnl, 0);
  const tot = d.equity - d.start;
  $("#fee").textContent = "$" + d.fee;
  const sw = d.schwab || {};
  $("#mode").innerHTML = (d.mode === "live" ? '· <span class="pill r">💵 כסף אמיתי</span>' : "· כסף וירטואלי")
    + (d.paused ? ' <span class="pill y">⏸️ בהשהיה</span>' : "")
    + (sw.connected ? ` <span class="pill g">Schwab ✓ ${sw.days_left >= 1.5 ? Math.round(sw.days_left) + " ימים" : Math.max(1, Math.round(sw.days_left * 24)) + " שעות"}</span>` : "");
  let h = `<div class="kpis">
   <div class="kpi"><div class="l">שווי התיק</div><div class="v">${usd(d.equity)}</div><div class="s ${cls(tot)}">${usd(tot,1)} (${pct(tot/d.start*100)})</div></div>
   <div class="kpi"><div class="l">מזומן</div><div class="v">${usd(d.cash)}</div><div class="s mute">התחלה ${usd(d.start)}</div></div>
   <div class="kpi"><div class="l">רווח/הפסד פתוח</div><div class="v ${cls(open)}">${usd(open,1)}</div><div class="s mute">${d.pos.length} פוזיציות</div></div>
   <div class="kpi"><div class="l">רווח/הפסד ממומש</div><div class="v ${cls(real)}">${usd(real,1)}</div><div class="s mute">עמלות ${usd(d.fees)}</div></div>
   <div class="kpi"><div class="l">אחוז הצלחה</div><div class="v">${closed.length ? Math.round(wins.length/closed.length*100)+"%" : "—"}</div><div class="s mute">${closed.length} מכירות</div></div>
  </div>
  <section><h2>שווי התיק לאורך זמן</h2><div id="eq" class="chart"></div></section>
  <section><h2>פוזיציות פתוחות <span class="c">${d.pos.length}</span></h2>`;
  if (d.pos.length){
    if (!d.pos.find(p => p.sym === sel)) sel = d.pos[0].sym;
    h += `<div class="tabs">` + d.pos.map(p => { const ch = ((p.last||p.entry)/p.entry-1)*100;
      return `<button class="tab ${p.sym===sel?"on":""}" data-s="${p.sym}">${p.sym} <span class="${cls(ch)}">${pct(ch)}</span></button>`;}).join("") + `</div>`;
    const p = d.pos.find(p => p.sym === sel), ch = ((p.last||p.entry)/p.entry-1)*100, pl = p.shares*((p.last||p.entry)-p.entry);
    h += `<div id="pc" class="chart" style="height:280px"></div><div class="posinfo">
      <div>מניות<b>${p.shares.toLocaleString()}${p.shares0 !== p.shares ? " / "+p.shares0.toLocaleString() : ""}</b></div>
      <div>קנייה<b>$${px(p.entry)}</b></div><div>עכשיו<b class="${cls(ch)}">$${px(p.last)} (${pct(ch)})</b></div>
      <div>רווח/הפסד<b class="${cls(pl)}">${usd(pl,1)}</b></div>
      <div>${p.runner ? "בונוס – ללא יעד" : "🎯 יעד"}<b>${p.runner ? "—" : "$"+px(p.target)}</b></div>
      <div>🛑 עצירה<b>$${px(p.stop)}</b></div>
      <div>מצב<b style="direction:rtl">${p.runner ? '<span class="pill g">בונוס 1/3</span>' : p.be ? '<span class="pill g">בלי הפסד</span>' : '<span class="pill y">בסיכון</span>'}</b></div>
      <div>מוחזקת<b>${days(p.opened).toFixed(1)} ימים</b></div>
      <div style="grid-column:1/-1">סיבה<b style="direction:rtl;font-size:13px">${esc(p.cat)} · ציון ${p.score}/10 ${p.url ? `· <a href="${esc(p.url)}" target="_blank">לחדשה</a>` : ""}</b></div></div>`
      + insTable(p.ins);
  } else h += `<div class="empty">אין פוזיציות פתוחות כרגע.</div>`;
  h += `</section>
  ${(d.orders||[]).length ? `<section><h2>פקודות פתוחות ב-Schwab <span class="c">${d.orders.length}</span></h2><div class="wrap"><table><tr><th>מניה</th><th>פעולה</th><th>כמות</th><th>מחיר</th><th>נשלחה</th></tr>` +
    d.orders.map(o => `<tr><td><b>${o.sym}</b></td><td>${o.side === "BUY" ? '<span class="pill g">קנייה</span>' : '<span class="pill r">מכירה</span>'}</td><td class="n">${o.qty.toLocaleString()}</td><td class="n">$${px(o.price)}</td><td>${d8(o.ts)}</td></tr>`).join("") + `</table></div></section>` : ""}
  <section><h2>במעקב לקנייה <span class="c">${d.cands.length}</span></h2>` + (d.cands.length ? `<div class="wrap"><table><tr><th>מניה</th><th>חדשה</th><th>ציון</th><th>מצב</th></tr>` +
    d.cands.map(c => `<tr><td><b>${c.sym}</b></td><td class="why">${c.url ? `<a href="${esc(c.url)}" target="_blank">${esc(c.cat)}</a>` : esc(c.cat)}</td><td class="n">${c.score}</td><td class="why">${esc(c.why) || "בודק…"}</td></tr>`).join("") + `</table></div>`
    : `<div class="empty">אין מניות במעקב כרגע. כשתגיע חדשה חיובית חזקה היא תופיע כאן.</div>`) + `</section>
  <section><h2>היסטוריית מכירות <span class="c">${closed.length}</span></h2>` + (closed.length ? `<div class="wrap"><table><tr><th>תאריך</th><th>מניה</th><th>מניות</th><th>קנייה</th><th>מכירה</th><th>שינוי</th><th>רווח/הפסד</th><th>R</th><th>סיבה</th></tr>` +
    closed.slice().reverse().map(x => { const c = (x.exit/x.entry-1)*100; return `<tr><td>${d8(x.closed)}</td><td><b>${x.sym}</b>${x.part ? ' <span class="pill">חלקית</span>' : ""}</td><td class="n">${x.shares.toLocaleString()}</td><td class="n">$${px(x.entry)}</td><td class="n">$${px(x.exit)}</td><td class="n ${cls(c)}">${pct(c)}</td><td class="n ${cls(x.pnl)}">${usd(x.pnl,1)}</td><td class="n ${cls(x.r)}">${x.r>0?"+":""}${x.r.toFixed(1)}</td><td class="why">${esc(x.why)}</td></tr>`;}).join("") + `</table></div>`
    : `<div class="empty">עוד אין מכירות.</div>`) + `</section>`;
  const sk = Object.entries(d.skips||{}).flatMap(([day, l]) => l.map(x => [day, ...x]));
  h += `<section><h2>חדשות שלא נקנו היום <span class="c">${sk.length}</span></h2>` + (sk.length ? `<div class="wrap"><table><tr><th>מניה</th><th>למה לא</th></tr>` +
    sk.map(x => `<tr><td><b>${x[1]}</b></td><td class="why">${esc(x[2])}</td></tr>`).join("") + `</table></div>` : `<div class="empty">אין.</div>`) + `</section>`;
  $("#app").innerHTML = h;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { sel = b.dataset.s; render(); });

  const ec = chart($("#eq"), 220), es = ec.addAreaSeries({lineColor:"#4c8dff", topColor:"rgba(76,141,255,.35)", bottomColor:"rgba(76,141,255,0)", lineWidth:2});
  const eq = d.eq.length ? d.eq : [[d.updated, d.equity]];
  es.setData(eq.map(([t,v]) => ({time:t+tz, value:v})));
  es.createPriceLine({price:d.start, color:"#8a93a6", lineStyle:2, lineWidth:1, axisLabelVisible:true, title:"התחלה"});
  ec.timeScale().fitContent();
  const p = d.pos.find(p => p.sym === sel);
  if (p){
    const c = chart($("#pc"), 280), fmt = {type:"price", precision: p.entry < 1 ? 4 : 2, minMove: p.entry < 1 ? 0.0001 : 0.01};
    const cs = c.addCandlestickSeries({upColor:"#26a69a", downColor:"#ef5350", borderVisible:false, wickUpColor:"#26a69a", wickDownColor:"#ef5350", priceFormat:fmt,
      autoscaleInfoProvider: orig => { const r = orig(); if (!r) return r; const lv = [p.stop, p.runner ? p.stop : p.target];
        r.priceRange.minValue = Math.min(r.priceRange.minValue, ...lv); r.priceRange.maxValue = Math.max(r.priceRange.maxValue, ...lv); return r; }});
    const bars = p.bars.length ? p.bars : [[d.updated, p.last, p.last, p.last, p.last, 0]];
    cs.setData(bars.map(b => ({time:b[0]+tz, open:b[1], high:b[2], low:b[3], close:b[4]})));
    const vs = c.addHistogramSeries({priceScaleId:"v", priceFormat:{type:"volume"}, color:"rgba(76,141,255,.35)"});
    c.priceScale("v").applyOptions({scaleMargins:{top:.8, bottom:0}});
    vs.setData(bars.map(b => ({time:b[0]+tz, value:b[5]})));
    let day = "", pv = 0, vv = 0, ema = null; const vw = [], em = [], k = 2/(9+1);
    bars.forEach(b => { const dd = new Date(b[0]*1000).toDateString(); if (dd !== day) { day = dd; pv = 0; vv = 0; }
      pv += (b[2]+b[3]+b[4])/3 * b[5]; vv += b[5]; if (vv) vw.push({time:b[0]+tz, value:pv/vv});
      ema = ema == null ? b[4] : b[4]*k + ema*(1-k); em.push({time:b[0]+tz, value:ema}); });
    c.addLineSeries({color:"#f0b429", lineWidth:1, priceLineVisible:false, lastValueVisible:false, title:"VWAP", priceFormat:fmt}).setData(vw);
    c.addLineSeries({color:"#c77dff", lineWidth:1, priceLineVisible:false, lastValueVisible:false, title:"EMA9", priceFormat:fmt}).setData(em);
    cs.createPriceLine({price:p.entry, color:"#4c8dff", lineWidth:1, lineStyle:0, title:"קנייה"});
    cs.createPriceLine({price:p.stop, color:"#ef5350", lineWidth:1, lineStyle:2, title:"עצירה"});
    if (!p.runner) cs.createPriceLine({price:p.target, color:"#26a69a", lineWidth:1, lineStyle:2, title:"יעד"});
    if (p.ref) cs.createPriceLine({price:p.ref, color:"#8a93a6", lineWidth:1, lineStyle:1, title:"לפני החדשה"});
    c.timeScale().fitContent();
  }
  const age = Math.round((Date.now()/1000 - d.updated)/60), u = $("#upd");
  u.textContent = age <= 10 ? "עודכן לפני " + age + " דק׳" : "עודכן " + d8(d.updated);
  u.className = "badge" + (age <= 10 ? " live" : "");
  renderLive();
}

// ---------- live market (Schwab stream): Level 1, Level 2 and the trade tape ----------
const SKEY = keep("otc_s", HP.get("s"));
const WORKER = "https://otc-schwab.range-guard.workers.dev";
const BOOKS = ["NASDAQ_BOOK", "NYSE_BOOK"];    // which book services carry OTC stocks is checked on the first connection
const L1F = {0:"sym",1:"bid",2:"ask",3:"last",4:"bidSize",5:"askSize",8:"vol",9:"lastSize",10:"high",11:"low",12:"close",35:"tradeTime"};
const live = {sym:null, ws:null, si:null, l1:{}, book:null, tape:[], state:"off", err:"", rid:1};

function liveSyms(){ const d = data || {pos:[], cands:[]}; return [...new Set([...d.pos.map(p => p.sym), ...d.cands.map(c => c.sym)])]; }
function liveSend(service, command, parameters){
  const si = live.si;
  live.ws.send(JSON.stringify({requests:[{service, command, requestid:String(live.rid++),
    SchwabClientCustomerId:si.schwabClientCustomerId, SchwabClientCorrelId:si.schwabClientCorrelId, parameters}]}));
}
function liveSub(sym){
  live.sym = sym; live.l1 = {}; live.book = null; live.tape = [];
  if (live.state !== "on") return renderLive();
  liveSend("LEVELONE_EQUITIES", "SUBS", {keys:sym, fields:Object.keys(L1F).join(",")});
  BOOKS.forEach(b => liveSend(b, "SUBS", {keys:sym, fields:"0,1,2,3"}));
  renderLive();
}
async function liveStart(){
  if (!SKEY) { live.state = "nokey"; return renderLive(); }
  live.state = "connecting"; renderLive();
  try {
    const r = await fetch(WORKER + "/stream?k=" + encodeURIComponent(SKEY)), j = await r.json();
    if (!j.access_token) { live.state = "off"; live.err = j.error || ""; return renderLive(); }
    live.si = j.streamer;
    live.ws = new WebSocket(j.streamer.streamerSocketUrl);
    live.ws.onopen = () => liveSend("ADMIN", "LOGIN", {Authorization:j.access_token,
      SchwabClientChannel:live.si.schwabClientChannel, SchwabClientFunctionId:live.si.schwabClientFunctionId});
    live.ws.onmessage = ev => liveMsg(JSON.parse(ev.data));
    live.ws.onclose = () => { live.state = "closed"; renderLive(); };
  } catch(e){ live.state = "off"; live.err = String(e); renderLive(); }
}
function liveMsg(m){
  (m.response || []).forEach(r => { if (r.service === "ADMIN" && r.command === "LOGIN") {
    if ((r.content || {}).code === 0) { live.state = "on"; liveSub(live.sym || liveSyms()[0] || ""); }
    else { live.state = "off"; live.err = (r.content || {}).msg || "login"; renderLive(); } } });
  (m.data || []).forEach(d => (d.content || []).forEach(c => {
    if (c.key !== live.sym) return;
    if (d.service === "LEVELONE_EQUITIES") {
      const prev = {...live.l1};
      for (const [k, v] of Object.entries(c)) if (L1F[k]) live.l1[L1F[k]] = v;
      const l = live.l1;
      const traded = l.tradeTime !== prev.tradeTime || (l.vol !== prev.vol && prev.vol !== undefined);
      if (traded && l.last) {     // a new trade (print): at the ask = a buyer paid up, at the bid = a seller hit the bid
        const side = l.ask && l.last >= l.ask ? "buy" : l.bid && l.last <= l.bid ? "sell" : "";
        live.tape.unshift({t:l.tradeTime || Date.now(), p:l.last, s:l.lastSize || 0, side});
        live.tape = live.tape.slice(0, 300);
      }
    } else if (BOOKS.includes(d.service)) {
      const lv = a => (a || []).map(x => ({p:x[0], s:x[1], n:x[2], mm:(x[3] || []).map(y => ({id:y[0], s:y[1]}))}));
      if ((c[2] && c[2].length) || (c[3] && c[3].length)) live.book = {bids:lv(c[2]), asks:lv(c[3]), svc:d.service};
    }
  }));
  renderLive();
}
function insight(){
  const out = [], since = Date.now() - 5*60000, recent = live.tape.filter(x => x.t >= since);
  const bv = recent.filter(x => x.side === "buy").reduce((a,x) => a + x.s, 0), sv = recent.filter(x => x.side === "sell").reduce((a,x) => a + x.s, 0);
  if (bv + sv) out.push(`5 דקות אחרונות: <span class="buy">קונים ${bv.toLocaleString()}</span> מול <span class="sell">מוכרים ${sv.toLocaleString()}</span> (${Math.round(bv/(bv+sv)*100)}% קנייה)`);
  const b = live.book;
  if (b && b.bids.length) {
    const lv = [...new Set(b.bids.map(x => x.p).filter(Boolean))].sort((a,c) => c - a);
    for (let i = 0; i + 1 < lv.length; i++) if (1 - lv[i+1]/lv[i] >= 0.25) {
      out.push(`🕳️ חור בצד הקונים: אחרי $${px(lv[i])} הקונה הבא רק ב-$${px(lv[i+1])} (−${Math.round((1 - lv[i+1]/lv[i])*100)}%) – עצירה מתחת ל-$${px(lv[i])} עלולה להתבצע הרבה יותר נמוך`);
      break; }
  }
  if (b && b.asks.length) {
    const sizes = b.asks.map(x => x.s).sort((a,c) => a - c), med = sizes[Math.floor(sizes.length/2)] || 1;
    const wall = b.asks.slice(0, 6).find(x => x.s >= 5*med && x.s > 0);
    if (wall) out.push(`🧱 קיר מוכרים ב-$${px(wall.p)}: ${wall.s.toLocaleString()} מניות` + (wall.mm.length ? ` (${wall.mm.map(m => m.id).join(", ")})` : ""));
    const bs = b.bids.slice(0, 3).reduce((a,x) => a + x.s, 0), as = b.asks.slice(0, 3).reduce((a,x) => a + x.s, 0);
    if (bs + as) out.push(`3 רמות ראשונות: <span class="buy">ביקוש ${bs.toLocaleString()}</span> מול <span class="sell">היצע ${as.toLocaleString()}</span>`);
  }
  return out;
}
function ladder(){
  const b = live.book, l = live.l1; if (!b || !(b.bids.length || b.asks.length)) return "";
  const ref = l.last || (b.asks[0] || b.bids[0]).p, t = ref < 1 ? 0.0001 : 0.01, dg = ref < 1 ? 4 : 2, key = p => (+p).toFixed(dg);
  const bs = {}, as = {};
  b.bids.forEach(x => bs[key(x.p)] = (bs[key(x.p)] || 0) + x.s); b.asks.forEach(x => as[key(x.p)] = (as[key(x.p)] || 0) + x.s);
  const hi = (b.asks[0] ? b.asks[0].p : ref) + 8*t, lo = Math.max(t, (b.bids[0] ? b.bids[0].p : ref) - 8*t);
  const pos = data && data.pos.find(p => p.sym === live.sym), mark = {};
  if (pos) { mark[key(pos.entry)] = "קנייה"; mark[key(pos.stop)] = "🛑 עצירה"; if (!pos.runner) mark[key(pos.target)] = "🎯 יעד"; }
  const rows = [];
  for (let p = hi; p >= lo - t/2; p -= t) { const k = key(p), last = l.last && key(l.last) === k;
    rows.push(`<tr style="${last ? "background:#26304a" : ""}"><td class="n b">${bs[k] ? bs[k].toLocaleString() : ""}</td>
      <td class="n" style="font-weight:${last ? 700 : 400}">${k}</td><td class="n a">${as[k] ? as[k].toLocaleString() : ""}</td>
      <td class="mute" style="font-size:11px">${mark[k] || ""}</td></tr>`); }
  return `<h2 style="border-top:1px solid var(--line)">סולם מחירים <span class="c">כמו Active Trader · קונים | מחיר | מוכרים</span></h2>
    <div class="wrap book" style="max-height:320px;overflow-y:auto"><table><tr><th>קונים</th><th>מחיר</th><th>מוכרים</th><th></th></tr>${rows.join("")}</table></div>`;
}
function renderLive(){
  const el = $("#liveBody"); if (!el) return;
  const syms = liveSyms();
  const bar = `<div class="livebar">${syms.map(s => `<button class="tab ${s===live.sym?"on":""}" data-l="${s}">${s}</button>`).join("")}
    <input id="lsym" placeholder="מניה…" maxlength="6"><button class="tab" id="lgo">הצג</button></div>`;
  let body;
  if (live.state === "nokey" || (live.state === "off" && /login|forbidden/.test(live.err))) body = `<div class="empty">השוק החי יופעל אחרי החיבור ל-Schwab (פקודה /schwab בבוט).</div>`;
  else if (live.state === "off" || live.state === "closed") body = `<div class="empty">השידור החי לא זמין כרגע${live.err ? " (" + esc(live.err) + ")" : ""}. <button class="tab" id="lre">התחבר שוב</button></div>`;
  else if (live.state === "connecting") body = `<div class="empty">מתחבר ל-Schwab…</div>`;
  else if (!live.sym) body = `<div class="empty">בחר מניה או כתוב טיקר.</div>`;
  else {
    const l = live.l1, spr = l.bid && l.ask ? (l.ask/l.bid - 1)*100 : null;
    body = `<div class="l1"><div>קונים (Bid)<b class="buy">$${px(l.bid)} × ${(l.bidSize||0).toLocaleString()}</b></div>
      <div>מוכרים (Ask)<b class="sell">$${px(l.ask)} × ${(l.askSize||0).toLocaleString()}</b></div>
      <div>אחרון<b>$${px(l.last)}</b></div><div>פער<b>${spr == null ? "—" : spr.toFixed(0) + "%"}</b></div>
      <div>ווליום<b>${(l.vol||0).toLocaleString()}</b></div><div>טווח היום<b>$${px(l.low)}–$${px(l.high)}</b></div></div>`
      + insight().map(x => `<div class="insight">${x}</div>`).join("");
    const b = live.book, rows = [];
    if (b) for (let i = 0; i < Math.max(b.bids.length, b.asks.length) && i < 12; i++) {
      const x = b.bids[i], y = b.asks[i];
      rows.push(`<tr><td>${x ? (x.mm.map(m => m.id).join(",") || x.n) : ""}</td><td class="n b">${x ? x.s.toLocaleString() : ""}</td><td class="n b">${x ? "$"+px(x.p) : ""}</td>
        <td class="n a">${y ? "$"+px(y.p) : ""}</td><td class="n a">${y ? y.s.toLocaleString() : ""}</td><td>${y ? (y.mm.map(m => m.id).join(",") || y.n) : ""}</td></tr>`);
    }
    body += ladder();
    body += `<div class="lv"><div><h2 style="border-top:1px solid var(--line)">Level 2 <span class="c">${b ? b.svc : "אין נתונים למניה הזו (עדיין)"}</span></h2>
      <div class="wrap book"><table><tr><th>MM</th><th>כמות</th><th>Bid</th><th>Ask</th><th>כמות</th><th>MM</th></tr>${rows.join("")}</table></div></div>
      <div><h2 style="border-top:1px solid var(--line)">עסקאות בזמן אמת <span class="c">${live.tape.length}</span></h2><div class="tape"><table>
      ${live.tape.slice(0, 80).map(x => `<tr class="${x.side}"><td>${new Date(x.t).toLocaleTimeString("he-IL")}</td><td class="n">$${px(x.p)}</td><td class="n">${x.s.toLocaleString()}</td><td>${x.side === "buy" ? "קנייה" : x.side === "sell" ? "מכירה" : ""}</td></tr>`).join("")}</table></div></div></div>`;
  }
  el.className = ""; el.innerHTML = bar + body;
  el.querySelectorAll("[data-l]").forEach(b => b.onclick = () => liveSub(b.dataset.l));
  const go = () => { const v = ($("#lsym").value || "").trim().toUpperCase(); if (/^[A-Z]{1,6}$/.test(v)) liveSub(v); };
  $("#lgo").onclick = go; $("#lsym").onkeydown = e => { if (e.key === "Enter") go(); };
  const re = $("#lre"); if (re) re.onclick = liveStart;
}

async function tick(){
  try { data = await load(); render(); }
  catch(e){ if (!data) $("#app").innerHTML = `<div class="err">לא הצלחתי לפתוח את הנתונים.<br>פתח את המסך מהכפתור בבוט בטלגרם (פקודה /dashboard).</div>`; $("#upd").textContent = "שגיאה"; }
}
if (!key) { $("#app").innerHTML = `<div class="err">🔒 המסך פרטי.<br>פתח אותו מהכפתור בבוט בטלגרם (פקודה /dashboard).</div>`; $("#upd").textContent = "נעול"; }
else { tick().then(liveStart); setInterval(tick, 60000); }
</script>
</body>
